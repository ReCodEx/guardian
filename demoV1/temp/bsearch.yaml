root-dir: /isolate_boxes
root-cg: /sys/fs/cgroup/isolate_boxes
as-uid: 1234 
as-gid: 1234
# name: bsearch
box-fs:
  dir-rules:
    - "tests=/home/simonkurz/mff/rcdx_cntnr/demoV1/tests"
    - "res=/home/simonkurz/mff/rcdx_cntnr/demoV1/temp/res:rw"
tasks:
    - task-id: "bsearch"
      stats-yaml: "/res/result.yaml"
      cmd:
        bin: "/tests/test_binaries/bsearch"
      limits:
          mem: 5000
          cpu-time: 1
          # wall-time: 2
          extra-time: 2
          stack: 100000
          open-files: 40
          file-size: 0