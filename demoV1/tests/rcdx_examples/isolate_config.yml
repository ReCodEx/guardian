# [job_logger] [debug]   --env=M2_HOME=/opt/maven-repo
env: 
  # inherit-all: true
  vars:
   - LD_LIBRARY_PATH=/opt/intel/oneapi/compiler/latest/opt/oclfpga/host/linux64/lib:/opt/intel/oneapi/compiler/latest/opt/compiler/lib:/opt/intel/oneapi/compiler/latest/lib:/opt/intel/oneapi/tbb/latest/lib/intel64/gcc4.8:/usr/local/recodex-gcc/lib64 
   - PATH=/opt/intel/oneapi/compiler/latest/bin/compiler:/opt/intel/oneapi/compiler/latest/bin:/var/recodex-worker-python-venv/bin:/usr/local/recodex-gcc/bin:/usr/bin:/bin                                                                                   
   - HOME=/box
   - JAVA_HOME=/usr/lib/jvm/jre-openjdk
   - PPC_CONFIG_PATH=/usr/etc                                                                                                                                                                                                                               
   - PYTHONHASHSEED=0
   - PYTHONIOENCODING=utf-8
   - VIRTUAL_ENV=/var/recodex-worker-python-venv
   - GO111MODULE=auto
   - GROOVY_HOME=/opt/groovy
   - MAVEN_HOME=/opt/maven
   - M2_HOME=/opt/maven-repo

# [job_logger] [debug]   --dir=/tmp:tmp
# [job_logger] [debug]   --dir=/var/recodex-worker-python-venv
# [job_logger] [debug]   --dir=/opt/remi
# [job_logger] [debug]   --dir=/opt/kotlin
# [job_logger] [debug]   --dir=/opt/groovy
# [job_logger] [debug]   --dir=/opt/maven
# [job_logger] [debug]   --dir=/opt/maven-repo
# [job_logger] [debug]   --dir=/opt/dotnet
# [job_logger] [debug]   --dir=/opt/Picat
# [job_logger] [debug]   --dir=/opt/intel
# [job_logger] [debug]   --dir=/etc/java
# [job_logger] [debug]   --dir=/etc/OpenCL
# [job_logger] [debug]   --dir=etc/alternatives=/etc/alternatives:maybe
box-fs:
  dir-rules:
    - run
    - tmp:tmp
    - var/recodex-worker-python-venv:maybe
    - opt/worker
    - opt/remi:maybe                      
    - opt/kotlin:maybe                   
    - opt/groovy:maybe                   
    - opt/maven:maybe
    - opt/maven-repo:maybe
    - opt/dotnet:maybe
    - opt/Picat:maybe
    - opt/intel:maybe
    - etc/java:maybe
    - etc/OpenCL:maybe
    - etc/alternatives=/etc/alternatives:maybe