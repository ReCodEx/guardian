root-dir: /isolate_boxes
root-cg: /sys/fs/cgroup/isolate_boxes
box-fs:
  dir-rules:
    - "tmp:tmp"
    - "tests=/home/simonkurz/mff/rcdx_cntnr/demoV1/tests"
    - "build=/home/simonkurz/mff/rcdx_cntnr/demoV1/build"
env:
  inherit-all: true
  vars:
    - GCC_EXEC_PREFIX=/usr/libexec/gcc/x86_64-redhat-linux/14/
    - HOME=
    - JAVA_HOME=/usr/lib/jvm/jre-openjdk
    - PPC_CONFIG_PATH=/usr/etc
    - PYTHONHASHSEED=0
    - PYTHONIOENCODING=utf-8
    - VIRTUAL_ENV=/var/recodex-worker-python-venv
    - GO111MODULE=auto
    - GROOVY_HOME=/opt/groovy
    - MAVEN_HOME=/opt/maven
    - M2_HOME=/opt/maven-repo
tasks:
    - task-id: "include-test"
      # chdir: tmp
      stats-yaml: "/result.yaml"
      cmd:
        bin: "/build/tests/file_utils_test"
        args:
          - "/usr"
          - "/usr/libexec/gcc/x86_64-redhat-linux/14/"
          - "/usr/include"