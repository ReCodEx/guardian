# id: 1
env: 
  # inherit-all: true
  vars:
  #  - CURRENTLY SET IN THE MOCK SCRIPT
  #  - LD_LIBRARY_PATH=/usr/lib/gcc/x86_64-redhat-linux/14/include:/usr/lib/gcc/x86_64-redhat-linux/14/:opt/intel/oneapi/compiler/latest/opt/oclfpga/host/linux64/lib:/opt/intel/oneapi/compiler/latest/opt/compiler/lib:/opt/intel/oneapi/compiler/latest/lib:/opt/intel/oneapi/tbb/latest/lib/intel64/gcc4.8:/usr/local/recodex-gcc/lib64 
  #  - JAVA_HOME=/usr/lib/jvm/jre-openjdk
  #  - PATH=/opt/intel/oneapi/compiler/latest/bin/compiler:/opt/intel/oneapi/compiler/latest/bin:/var/recodex-worker-python-venv/bin:/usr/local/recodex-gcc/bin:/usr/bin:/bin
  #  - HOME=/box
   - PPC_CONFIG_PATH=/usr/etc                                                                                                                                                                                                                               
   - PYTHONHASHSEED=0
   - PYTHONIOENCODING=utf-8
   - VIRTUAL_ENV=/var/recodex-worker-python-venv
   - GO111MODULE=auto
   - GROOVY_HOME=/opt/groovy
   - MAVEN_HOME=/opt/maven
   - M2_HOME=/opt/maven-repo

box-fs:
  dir-rules:
    - tmp:tmp
    - var/recodex-worker-python-venv:maybe
    - opt/worker:maybe
    - opt/remi:maybe                      
    - opt/kotlin:maybe                   
    - opt/groovy:maybe                   
    - opt/maven:maybe
    - opt/maven-repo:maybe
    - opt/dotnet:maybe
    - opt/Picat:maybe
    - opt/intel:maybe
    - opt/rh/gcc-toolset-14:maybe
    - etc/java:maybe
    - etc/OpenCL:maybe
    - etc/alternatives=/etc/alternatives:maybe
